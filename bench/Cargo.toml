[package]
name = "sandroute-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The capacity benchmark and the per-command cost measurement for sandroute, kept out of the library."
publish = false

[dependencies]
sandroute = { path = ".." }
anyhow = "1"
libc = "0.2"
async-trait = "0.1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
