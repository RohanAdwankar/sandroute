[package]
name = "sandroute"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Routes an agent's commands: a cheap sandbox for the ones that only touch files, a microVM for the rest."

[workspace]
members = [".", "guest-agent"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
fancy-regex = "0.14"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

[profile.release]
opt-level = 2
